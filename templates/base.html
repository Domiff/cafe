<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cafe{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/base.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-brand" href="/">Cafe</a>
    <nav class="site-nav">
      <a href="/menu">Меню</a>
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container">
    {% block footer %}Cafe — кофе и завтраки{% endblock %}
  </div>
</footer>
</body>
</html>
